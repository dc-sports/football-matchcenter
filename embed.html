<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>주간 해축 가이드</title>
<style>
/* 갤러리 게시글 iframe 전용: 프레임 높이 안에서만 스크롤, 외부 링크·고정 헤더·모달 없음 */
:root{--navy:#29367c;--navy-l:#3b4890;--gold:#f2b632;--gold-bg:#fff4d9;--gold-ink:#8a5a00;--ink:#1d2133;--sub:#646a82;--line:#e3e6ef;--bg:#f5f6fa;--card:#fff;--soft:#f8f9fc;--kor:#d6402f;--korbg:#fdeeec;--live:#16794a;--livebg:#e5f5ec;
--epl:#3d195b;--liga:#e2372d;--sa:#0b6fb8;--bl:#d20515;--l1:#091c3e;--etc:#6b7088;
--f:"Pretendard","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--f);background:var(--card);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible{outline:2px solid var(--gold);outline-offset:1px;border-radius:6px}
.app{height:100%;min-height:460px;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}

/* 상단 */
.top{background:linear-gradient(115deg,#1c2560,#29367c 60%,#3b4890);color:#fff;padding:12px 16px 0;flex:none}
.t1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.t1 h1{font-size:19px;letter-spacing:-.4px;font-weight:900;display:flex;align-items:center;gap:8px}
.t1 h1 em{font-style:normal;color:var(--gold)}
.t1 h1 img{width:30px;height:30px}
.rng{font-size:12.5px;font-weight:700;color:#d4d9f5;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);padding:2px 9px;border-radius:999px;font-variant-numeric:tabular-nums}
.t1 .sp{flex:1}
.stat{display:flex;gap:12px;font-size:12px;color:#c9cff0;font-weight:700}
.stat b{color:#fff;font-size:14px;font-variant-numeric:tabular-nums}
.next{margin-top:9px;display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.18);border-radius:9px;padding:7px 10px;font-size:13px;min-width:0}
.next .k{flex:none;font-size:11px;font-weight:900;letter-spacing:.5px;color:#1d2133;background:var(--gold);padding:1px 7px;border-radius:5px}
.next .m{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.next .cd{margin-left:auto;flex:none;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:2px;margin-top:10px}
.tab{flex:1;padding:9px 4px 10px;font-weight:800;font-size:14px;color:#c3c9ee;border-radius:9px 9px 0 0;white-space:nowrap}
.tab small{font-size:11.5px;font-weight:700;opacity:.75;margin-left:3px;font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{background:var(--bg);color:var(--navy)}

/* 본문 스크롤 영역 */
.panel{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;-webkit-overflow-scrolling:touch}
.pin{padding:12px 14px 18px}
.subbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 14px 8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:7px}
.chips{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:800;color:var(--sub)}
.chip i{width:7px;height:7px;border-radius:50%}
.chip small{font-weight:700;opacity:.75;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.chip[aria-pressed="true"] i{background:#fff!important}
.chip.k[aria-pressed="true"]{background:var(--korbg);border-color:var(--kor);color:var(--kor)}
.chip.b[aria-pressed="true"]{background:var(--gold-bg);border-color:var(--gold-ink);color:var(--gold-ink)}
.chips .div{flex:none;width:1px;background:var(--line);margin:3px 2px}

/* 핵심 경기 카드 */
.lead{font-size:13px;color:var(--sub);margin:0 2px 10px;word-break:keep-all}
.lead b{color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.mc{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.mc.kor{border-top:3px solid var(--kor)}
.mc.nk{border-top:3px solid var(--gold)}
.mc .hd{padding:11px 13px 9px;display:flex;flex-direction:column;gap:4px}
.mc .meta{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--sub);flex-wrap:wrap}
.mc .meta .when{color:var(--ink);font-variant-numeric:tabular-nums}
.mc .vsb{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:900;letter-spacing:-.3px;word-break:keep-all;line-height:1.3}
.mc .vsb em{font-style:normal;font-size:12px;font-weight:700;color:var(--sub)}
.mc .rk{font-size:11.5px;color:var(--sub);font-weight:700;margin-left:2px}
.mc .bd{padding:0 13px 12px;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.kline{background:var(--korbg);color:var(--kor);font-weight:700;border-radius:8px;padding:7px 10px;font-size:13px;word-break:keep-all}
ul.pts{list-style:none;display:flex;flex-direction:column;gap:4px}
ul.pts li{padding-left:13px;position:relative;word-break:keep-all}
ul.pts li:before{content:"";position:absolute;left:2px;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--gold)}
.h2h{display:flex;flex-direction:column;gap:4px}
.h2h .r{display:flex;gap:10px;justify-content:space-between;background:var(--soft);border:1px solid var(--line);border-radius:7px;padding:4px 9px;font-size:12.5px}
.h2h .r span:first-child{color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.h2h .r span:last-child{font-weight:700;text-align:right;word-break:keep-all}
.h2h p{font-size:12px;color:var(--sub)}
.h4{font-size:11px;letter-spacing:1px;font-weight:900;color:var(--navy-l)}
.cmt{margin-top:auto;border-top:1px dashed var(--line);background:var(--soft);padding:8px 13px;font-size:12.5px;color:var(--sub);display:flex;gap:6px;align-items:baseline;word-break:keep-all}
.cmt b{color:var(--navy);flex:none}
.more{margin:16px 2px 8px;font-size:13px;font-weight:900;color:var(--ink);display:flex;align-items:center;gap:8px}
.more:after{content:"";flex:1;height:1px;background:var(--line)}

/* 일정 행 */
.day{margin-bottom:14px}
.dh{position:sticky;top:var(--subh,0px);z-index:3;background:var(--bg);display:flex;align-items:baseline;gap:8px;padding:8px 2px 6px}
.dh b{font-size:15px}
.dh span{font-size:12px;color:var(--sub);font-weight:700}
.list{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line);text-align:left;width:100%}
.list>.row:first-child,.list>.rw:first-child>.row{border-top:0}
.row.kor{box-shadow:inset 3px 0 0 var(--kor)}
.row.end{opacity:.55}
button.row:hover{background:var(--soft)}
.tm{font-variant-numeric:tabular-nums;font-weight:900;font-size:15px;line-height:1.15}
.tm small{display:block;font-size:10.5px;color:var(--sub);font-weight:700}
.vs{min-width:0}
.vs .lb{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:800;line-height:1.3;margin-bottom:1px}
.vs .lb i{width:6px;height:6px;border-radius:50%}
.vs .tt{font-size:14px;font-weight:700;word-break:keep-all}
.vs .tt em{font-style:normal;color:var(--sub);font-weight:500;margin:0 4px;font-size:12.5px}
.vs .tt b{white-space:nowrap}.vs .r{white-space:nowrap;font-size:11px;color:var(--sub);font-weight:700;margin-left:2px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.tag{font-size:11px;font-weight:800;padding:1px 7px;border-radius:5px;background:#eef0f6;color:var(--sub)}
.tag.k{background:var(--korbg);color:var(--kor)}
.tag.b{background:var(--gold-bg);color:var(--gold-ink)}
.rt{display:flex;align-items:center;gap:6px}
.st{font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;white-space:nowrap}
.st.pre{background:#eef0f6;color:var(--sub)}
.st.live{background:var(--livebg);color:var(--live)}
.st.end{color:var(--sub);border:1px solid var(--line)}
.chev{width:16px;height:16px;color:var(--sub);transition:transform .15s}
[aria-expanded="true"] .chev{transform:rotate(180deg)}
.pv{background:var(--soft);border-top:1px solid var(--line);padding:10px 12px 12px 14px;display:grid;grid-template-columns:1.3fr 1fr;gap:12px;font-size:13px}
.pv>div{display:flex;flex-direction:column;gap:6px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--sub);display:flex;align-items:center;justify-content:center;gap:10px;font-size:13px}
.empty img{width:44px}

/* 코리안리거 */
.kp{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.pc{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--kor);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;text-align:left;width:100%}
.pc:hover{background:#fffafa}
.pc .a{display:flex;align-items:baseline;gap:6px}
.pc .nm{font-size:16px;font-weight:900}
.pc .cl{font-size:12px;color:var(--sub);font-weight:700}
.pc .a .st{margin-left:auto}
.pc .mt{font-size:13px;font-weight:700;word-break:keep-all}
.pc .mt b{color:var(--kor);font-variant-numeric:tabular-nums;margin-right:4px}
.pc .note{font-size:12.5px;color:var(--sub);word-break:keep-all}

/* 순위 */
.tblw{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:6px 6px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
th{font-size:11.5px;color:var(--sub);font-weight:800;background:var(--soft)}
td.tl,th.tl{text-align:left;padding-left:10px}
td.pts{font-weight:900}
td.n{color:var(--sub);font-weight:700;width:30px}
tr.kor td.tl b{color:var(--kor)}
tr.ucl td.n{box-shadow:inset 3px 0 0 #2f6fd6}
tr.rel td.n{box-shadow:inset 3px 0 0 #d9483b}
td .kn{font-size:11px;color:var(--kor);font-weight:800;margin-left:4px}
td .nx{font-size:11px;color:var(--sub);font-weight:700;margin-left:4px}
.tnote{font-size:11.5px;color:var(--sub);margin-top:7px;display:flex;gap:12px;flex-wrap:wrap}
.tnote i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}

/* 하단 고정 안내 */
.ft{flex:none;background:var(--card);border-top:1px solid var(--line);padding:8px 14px;font-size:12px;color:var(--sub);display:flex;align-items:center;gap:10px}
.ft .msg{min-width:0;word-break:keep-all}
.ft .msg b{color:var(--navy)}
.ft .asof{margin-left:auto;flex:none;font-variant-numeric:tabular-nums}

/* 운영용(?ops) */
.ops{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px;display:flex;flex-direction:column;gap:8px}
.ops textarea{width:100%;height:240px;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--soft);color:var(--ink)}
.ops .bt{display:flex;gap:6px;justify-content:flex-end}
.ops button{border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:800}
.ops .msg{font-size:12px;color:var(--live);font-weight:700}

@media (max-width:640px){
 .top{padding:10px 12px 0}
 .t1{flex-wrap:nowrap;gap:8px}.t1 h1{font-size:16px;white-space:nowrap;gap:6px}.t1 h1 img{width:24px;height:24px}.rng{font-size:11px;padding:1px 7px;white-space:nowrap}.next{font-size:12.5px;margin-top:8px}
 .stat{display:none}
 .tab{font-size:13px;padding:8px 2px 9px}.tab small{display:none}
 .pin{padding:10px 10px 16px}.subbar{padding:8px 10px 7px}
 .cards,.kp{grid-template-columns:1fr}
 .pv{grid-template-columns:1fr}
 .row{grid-template-columns:44px 1fr auto;gap:8px;padding:9px 10px}
 .rt .st.pre{display:none}
 .ft .asof{display:none}
 th.g,td.g{display:none}
}
@media (max-width:330px){th.d,td.d,th.l,td.l{display:none}}
</style>
</head>
<body>
<div class="app">
 <div class="top">
  <div class="t1">
   <h1><img class="mimg" alt="">주간 <em>해축 가이드</em></h1>
   <span class="rng" id="rng"></span>
   <span class="sp"></span>
   <div class="stat" id="stat"></div>
  </div>
  <div class="next" id="next"></div>
  <div class="tabs" role="tablist" aria-label="보기 선택">
   <button class="tab" role="tab" data-v="hot" type="button">핵심 경기</button>
   <button class="tab" role="tab" data-v="sch" type="button">전체 일정<small id="cSch"></small></button>
   <button class="tab" role="tab" data-v="kor" type="button">코리안리거<small id="cKor"></small></button>
   <button class="tab" role="tab" data-v="tbl" type="button">순위</button>
  </div>
 </div>
 <div class="panel" id="panel" role="tabpanel"></div>
 <div class="ft"><span class="msg">결과 정리·다음 주 가이드는 <b>매주 이 갤러리 게시물</b>로 올라와요</span><span class="asof" id="asof"></span></div>
</div>

 SORTED.forEach(m=>{if(m.d!==cur){cur=m.d;L.push('','■ '+dlabel(m.d))}
  L.push((m.kor?'★ ':'· ')+m.t+' ['+(m.comp||LG[m.lg].s)+'] '+m.h+' vs '+m.a+(m.kor?' ('+m.kor.map(pname).join(', ')+')':'')+(m.tag?' - '+m.tag:''))});
 L.push('','※ 방송 편성에 따라 시간이 바뀔 수 있어요. 출전 여부는 킥오프 1시간 전 라인업으로 확인!');
 return L.join('\n');
}
function opsBox(){const b=el('div','ops','<b>운영용 · 게시글 본문 텍스트</b>');const t=el('textarea');t.value=noticeText();
 const msg=el('span','msg');const bt=el('div','bt');const c=el('button',null,'복사');c.type='button';
 c.onclick=async()=>{try{await navigator.clipboard.writeText(t.value);msg.textContent='복사했어요'}catch(e){t.select();msg.textContent='Ctrl+C로 복사해 주세요'}};
 bt.append(msg,c);b.append(t,bt);return b}

/* ---------- 탭 전환 ---------- */
let view='hot';
const VIEWS={hot:viewHot,sch:viewSch,kor:viewKor,tbl:viewTbl};
function show(v){
 const same=v===view;const keep=same?panel.scrollTop:0;view=v;
 document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.v===v));
 panel.innerHTML='';panel.append(VIEWS[v]());
 const sb=panel.querySelector('.subbar');panel.style.setProperty('--subh',(sb?sb.offsetHeight:0)+'px');
 panel.scrollTop=same&&v!=='sch'?keep:0;
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>show(t.dataset.v));

renderTop();show('hot');
setInterval(()=>{renderNext();if(view!=='tbl'){const k=panel.scrollTop;panel.innerHTML='';panel.append(VIEWS[view]());panel.scrollTop=k}},60000);
</script>
